version: '3.8'

services:
  # 1. Base de Datos Local (PostgreSQL)
  postgres_db:
    image: postgres:15-alpine
    container_name: validator_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  # 2. Servidor Backend (Node.js + Express)
  backend_api:
    build: ./backend
    container_name: validator_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=postgres_db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - TENANT_ID=${TENANT_ID}
      - CLIENT_ID=${CLIENT_ID}
      - CLIENT_SECRET=${CLIENT_SECRET}
    depends_on:
      - postgres_db

  # 3. Interfaz Frontend (React)
  frontend_ui:
    build: ./frontend
    container_name: validator_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend_api

volumes:
  db_data: